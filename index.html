<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HMS | Admin Login</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body class="login-page">


    <div class="login-container">


        <div class="login-card">


            <!-- HMS Logo -->

            <div class="login-logo">

                <h1>HMS</h1>

                <p>
                    Hostel Management System
                </p>

            </div>


            <!-- Login Heading -->

            <h2>
                Welcome Back
            </h2>

            <p class="login-subtitle">
                Login to manage your hostel
            </p>


            <!-- Login Form -->

            <form id="loginForm">


                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <div class="login-options">

                    <label class="remember-me">

                        <input
                            type="checkbox"
                            id="rememberMe"
                        >

                        Remember me

                    </label>


                    <a href="#" class="forgot-password">
                        Forgot Password?
                    </a>

                </div>


                <button
                    type="button"
                    class="login-btn"
                    onclick="window.location.href='pages/dashboard.html'"
>
                         🔐 Login
                </button>
                <p
                    id="loginMessage"
                    class="login-message"
                ></p>


            </form>


        </div>

    </div>


   <script src="js/script.js"></script>

</body>

</html>
