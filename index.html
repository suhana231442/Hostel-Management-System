<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HMS | Admin Login</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background:
                linear-gradient(135deg, #0f172a, #1e3a5f, #2563eb);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Background circles */

        body::before,
        body::after {
            content: "";
            position: fixed;
            border-radius: 50%;
            filter: blur(2px);
            opacity: 0.25;
        }

        body::before {
            width: 450px;
            height: 450px;
            background: #60a5fa;
            top: -180px;
            left: -150px;
        }

        body::after {
            width: 500px;
            height: 500px;
            background: #38bdf8;
            bottom: -220px;
            right: -160px;
        }

        /* Main card */

        .login-container {
            width: 100%;
            max-width: 430px;
            padding: 25px;
            position: relative;
            z-index: 2;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.96);
            border-radius: 24px;
            padding: 42px 38px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35);
            text-align: center;
        }

        /* Logo */

        .logo-box {
            width: 78px;
            height: 78px;
            margin: 0 auto 18px;
            border-radius: 20px;
            background: linear-gradient(135deg, #2563eb, #0ea5e9);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.35);
        }

        .logo-box span {
            font-size: 28px;
            font-weight: bold;
        }

        h1 {
            color: #0f172a;
            font-size: 27px;
            margin-bottom: 7px;
        }

        .subtitle {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 30px;
        }

        /* Form */

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #334155;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 14px 15px;
            border: 1px solid #cbd5e1;
            border-radius: 11px;
            outline: none;
            font-size: 15px;
            transition: 0.2s;
            background: #f8fafc;
        }

        input:focus {
            border-color: #2563eb;
            background: white;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        /* Login button */

        .login-btn {
            width: 100%;
            border: none;
            padding: 15px;
            border-radius: 11px;
            background: linear-gradient(135deg, #2563eb, #0284c7);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.25s;
            margin-top: 8px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.3);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .demo {
            margin-top: 22px;
            padding: 12px;
            border-radius: 10px;
            background: #eff6ff;
            color: #475569;
            font-size: 12px;
        }

        .demo strong {
            color: #1d4ed8;
        }

        #loginMessage {
            margin-top: 15px;
            font-size: 14px;
        }

        .footer {
            margin-top: 25px;
            color: #94a3b8;
            font-size: 12px;
        }

        @media (max-width: 500px) {

            .login-card {
                padding: 32px 25px;
            }

        }

    </style>
</head>


<body>

    <div class="login-container">

        <div class="login-card">

            <div class="logo-box">
                <span>HMS</span>
            </div>

            <h1>Hostel Management System</h1>

            <p class="subtitle">
                Admin Portal · Secure Management Dashboard
            </p>


            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter admin email"
                        autocomplete="username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-btn"
                >
                    Login to Dashboard
                </button>


                <p id="loginMessage"></p>

            </form>


            <div class="demo">

                Demo Login:<br>

                <strong>admin@gmail.com</strong>
                /
                <strong>admin123</strong>

            </div>


            <div class="footer">

                © 2026 Hostel Management System

            </div>

        </div>

    </div>


    <script>

        /*
         * SIMPLE DEMO LOGIN
         *
         * No PHP authentication is used here.
         * This keeps the project working reliably
         * during local demonstration.
         */

        document
            .getElementById("loginForm")
            .addEventListener("submit", function(e) {

                e.preventDefault();

                const email =
                    document.getElementById("email")
                    .value
                    .trim();

                const password =
                    document.getElementById("password")
                    .value
                    .trim();

                const message =
                    document.getElementById("loginMessage");


                /*
                 * Login credentials
                 */

                if (
                    email === "admin@gmail.com" &&
                    password === "admin123"
                ) {

                    sessionStorage.setItem(
                        "adminLoggedIn",
                        "true"
                    );

                    sessionStorage.setItem(
                        "adminEmail",
                        email
                    );

                    sessionStorage.setItem(
                        "adminName",
                        "Administrator"
                    );


                    message.style.color = "#16a34a";

                    message.innerText =
                        "Login successful! Opening dashboard...";


                    setTimeout(function() {

                        window.location.href =
                            "/pages/dashboard.html";

                    }, 500);


                } else {

                    message.style.color = "#dc2626";

                    message.innerText =
                        "Invalid email or password.";

                }

            });

    </script>

</body>

</html>
