<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Notices & Services | HMS</title>
<link rel="stylesheet" href="../css/style.css">

<style>
body{margin:0;font-family:Arial;background:#f5f7fb;color:#14213d}
.layout{display:flex;min-height:100vh}
.sidebar{width:250px;background:#111b30;color:white;padding:25px 15px}
.logo{text-align:center;margin-bottom:40px}.logo h2{color:#20aee5;font-size:30px;margin:0}.logo p{color:#8b95a7}
.nav a{display:block;color:#dce3ef;text-decoration:none;padding:15px;border-radius:8px;margin:5px 0}
.nav a:hover,.nav a.active{background:#243452}
.main{flex:1;padding:35px}.header{display:flex;justify-content:space-between;align-items:center}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin:30px 0}
.card,.section{background:white;padding:22px;border-radius:12px;box-shadow:0 3px 12px #ddd}
button{padding:11px 18px;border:0;border-radius:7px;background:#20aee5;color:white;cursor:pointer}
button.danger{background:#e74c3c}
input,select,textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ccc;border-radius:7px;margin:7px 0 15px}
.modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center}
.modal-box{background:white;width:500px;padding:30px;border-radius:12px}
.close{float:right;font-size:25px;cursor:pointer}
.notice{border:1px solid #ddd;border-radius:10px;padding:20px;margin:15px 0}
</style>
</head>

<body>

<div class="layout">

<aside class="sidebar">

<div class="logo">
<h2>HMS</h2>
<p>Hostel Management</p>
</div>

<div class="nav">
<a href="dashboard.html">📊 Dashboard</a>
<a href="rooms.html">🛏️ Room Allocation</a>
<a href="students.html">👨‍🎓 Students</a>
<a href="fees.html">💰 Fee Payment</a>
<a href="complaints.html">📢 Complaints</a>
<a href="notices.html" class="active">🔔 Notices & Services</a>
</div>

</aside>

<main class="main">

<div class="header">

<div>
<h1>Notices & Services</h1>
<p>Manage hostel notices and services</p>
</div>

<div>
<b>🔵 Admin</b><br>
<small>Administrator</small>
</div>

</div>

<div class="cards">

<div class="card">
<h2 id="total">0</h2>
<p>Total Notices</p>
</div>

<div class="card">
<h2 id="urgent">0</h2>
<p>Urgent Notices</p>
</div>

<div class="card">
<h2 id="services">0</h2>
<p>Services</p>
</div>

</div>

<div class="section">

<div style="display:flex;justify-content:space-between;align-items:center">

<h2>Notices & Services</h2>

<button onclick="openModal()">＋ Add Notice</button>

</div>

<div id="noticeList"></div>

</div>

</main>
</div>

<div class="modal" id="modal">

<div class="modal-box">

<span class="close" onclick="closeModal()">×</span>

<h2>Add Notice / Service</h2>

<label>Title</label>

<input id="title" placeholder="Enter title">

<label>Type</label>

<select id="type">
<option>Notice</option>
<option>Service</option>
</select>

<label>Priority</label>

<select id="priority">
<option>Normal</option>
<option>Important</option>
<option>Urgent</option>
</select>

<label>Description</label>

<textarea id="description" rows="5"
placeholder="Enter notice or service details"></textarea>

<button onclick="addNotice()" style="width:100%">
Publish
</button>

</div>
</div>

<script>

let notices=JSON.parse(localStorage.getItem("hms_notices")) || [

{
title:"Water Supply Maintenance",
type:"Notice",
priority:"Important",
description:"Water supply maintenance will be carried out tomorrow from 10 AM to 2 PM.",
date:new Date().toLocaleDateString()
},

{
title:"Hostel Cleaning Service",
type:"Service",
priority:"Normal",
description:"Weekly room and common-area cleaning service is available every Saturday.",
date:new Date().toLocaleDateString()
}

];

function save(){

localStorage.setItem(
"hms_notices",
JSON.stringify(notices)
);

}

function render(){

let container=document.getElementById("noticeList");

container.innerHTML="";

let urgent=0;
let services=0;

notices.forEach((n,index)=>{

if(n.priority==="Urgent") urgent++;

if(n.type==="Service") services++;

let div=document.createElement("div");

div.className="notice";

div.innerHTML=`

<h2>${n.title}</h2>

<p>
<b>Type:</b> ${n.type}
</p>

<p>
<b>Priority:</b> ${n.priority}
</p>

<p>
<b>Date:</b> ${n.date}
</p>

<p>${n.description}</p>

<button class="danger"
onclick="deleteNotice(${index})">
Delete
</button>

`;

container.appendChild(div);

});

document.getElementById("total").innerText=notices.length;
document.getElementById("urgent").innerText=urgent;
document.getElementById("services").innerText=services;

}

function openModal(){

document.getElementById("modal").style.display="flex";

}

function closeModal(){

document.getElementById("modal").style.display="none";

}

function addNotice(){

let title=document.getElementById("title").value.trim();

let type=document.getElementById("type").value;

let priority=document.getElementById("priority").value;

let description=document
.getElementById("description")
.value.trim();

if(!title || !description){

alert("Please fill all fields.");

return;

}

notices.unshift({

title:title,
type:type,
priority:priority,
description:description,
date:new Date().toLocaleDateString()

});

save();
render();

closeModal();

document.getElementById("title").value="";
document.getElementById("description").value="";

alert("Notice published successfully!");

}

function deleteNotice(index){

if(confirm("Delete this notice?")){

notices.splice(index,1);

save();
render();

}

}

save();
render();

</script>

</body>
</html>
